# Minimal config: only what Pi needs inside tmux.
# tmux 3.4 → extended-keys on (csi-u format needs 3.5+); Pi falls back to modifyOtherKeys.
# tmux only sends the enable sequence to the outer terminal if it knows that
# terminal supports extended keys; the built-in xterm* entry has no extkeys.
set -as terminal-features 'xterm-kitty:extkeys'
set -g extended-keys on
# Keep kitty-graphics inline images from Pi working through tmux.
set -g allow-passthrough on

# --- mouse + truecolor (validated on a throwaway server, tmux 3.4) ---
# Single replacement for the old mode-mouse / mouse-select-pane / mouse-resize-pane /
# mouse-select-window quadruple: all four were removed in tmux 2.1.
# Plain drag selects via tmux copy-mode; Shift+drag selects with the outer terminal.
set -g mouse on

# tmux-256color (terminfo present) + RGB feature = 24-bit colour through the pane.
# screen-256color only ever gave 256 colours.
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm-kitty:RGB'

# Zoom toggle, replacing the tmp-window swap hack: prefix m, repeatable m to restore.
bind -r m resize-pane -Z

# Activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Status bar
set -g status-justify centre

# --- session survival: resurrect + continuum ---
# The server keeps session state in memory only: when it dies, every pane and
# its children die with it ("server exited unexpectedly"). These two plugins
# snapshot windows/panes/cwd/commands to ~/.local/share/tmux/resurrect (the
# plugin's XDG default; ~/.tmux/resurrect is used only if that dir already
# exists) so a dead layout can be rebuilt. Screen contents are NOT captured
# (@resurrect-capture-pane-contents stays off), so nothing scrolled in a pane is
# written to disk. Auto-restore fires at server start only while no other tmux
# server is running — with one already up, restore by hand (prefix C-r).
# Plugin dirs are per-machine, not tracked here — clone them once:
#   git clone https://github.com/tmux-plugins/tmux-resurrect  ~/.tmux/plugins/tmux-resurrect
#   git clone https://github.com/tmux-plugins/tmux-continuum  ~/.tmux/plugins/tmux-continuum
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# Guarded so a machine without the clones still sources this file cleanly.
if-shell 'test -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux' \
  'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell 'test -f ~/.tmux/plugins/tmux-continuum/continuum.tmux' \
  'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'
